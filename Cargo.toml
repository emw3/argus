[package]
name = "argus"
version = "0.1.1"
edition = "2021"
description = "A terminal dashboard that watches your services, sessions, and system metrics"
license = "MIT"
keywords = ["tui", "dashboard", "monitoring", "systemd", "docker"]
categories = ["command-line-utilities"]
readme = "README.md"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
async-trait = "0.1"
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
